[package]
name = "gbf-flash-cache-core"
version = "1.14.98"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
flate2 = "1"
brotli = { version = "8", default-features = false, features = ["std"] }
zstd = { version = "0.13", default-features = false }
indexmap = "=2.7.1"
lru = "0.12.5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "=2.4.1"

rcgen = { version = "0.13.2", features = ["x509-parser"] }
time = "=0.3.44"
tempfile = "3"
x509-parser = { version = "0.16", features = ["verify"] }
bytes = "1"
http = "1"
httpdate = "1"
same-file = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
base64 = "0.22"
tokio-socks = "0.5"
percent-encoding = "2"
tower-service = "0.3"
cap-std = "3"


[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "socks", "stream"] }
